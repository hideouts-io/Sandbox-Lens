name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build universal app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version

      - name: Test Swift behavior
        run: swift test

      - name: Test baseline generator
        run: PYTHONPATH=scripts python3 -m unittest discover -s Tests/Scripts -v

      - name: Check repository boundaries
        run: python3 scripts/check_repository.py

      - name: Check shell syntax
        run: find script scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Build universal release executable
        run: swift build -c release --arch arm64 --arch x86_64
